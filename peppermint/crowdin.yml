# Peppermint's own strings, in a Crowdin project of their own. Zen's strings
# are translated in Zen's project and arrive with the daily upstream sync.
# Used by .github/workflows/peppermint-l10n.yml (see peppermint/TRANSLATING.md).

project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
base_path: ".."
preserve_hierarchy: true

files:
  - source: /peppermint/locales/en-US/browser/browser/**/*.ftl
    translation: /peppermint/locales/%locale%/browser/browser/**/%original_file_name%
    # Only what is translated: English copies would hide Zen's translations.
    skip_untranslated_strings: true
    # Folder names are the ones in locales/supported-languages.
    languages_mapping:
      locale:
        ar: ar
        bg: bg
        bs: bs
        ca: ca
        cs: cs
        cy: cy
        da: da
        de: de
        el: el
        en-GB: en-GB
        es-ES: es-ES
        et: et
        fa: fa
        fi: fi
        fr: fr
        ga-IE: ga-IE
        he: he
        hu: hu
        id: id
        is: is
        it: it
        ja: ja
        ko: ko
        lt: lt
        nb: nb
        nl: nl
        nn-NO: nn-NO
        pl: pl
        pt-BR: pt-BR
        pt-PT: pt-PT
        ro: ro
        ru: ru
        sk: sk
        sv-SE: sv-SE
        th: th
        tr: tr
        uk: uk
        vi: vi
        zh-CN: zh-CN
        zh-TW: zh-TW
