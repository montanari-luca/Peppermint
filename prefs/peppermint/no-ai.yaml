# No AI: Firefox's AI features stay off. Zen already turns off the ML engine,
# the chatbot sidebar and link previews (prefs/firefox/ai.yaml); these are the
# ones it leaves on. Translations are not covered: they run on the device and
# only when asked.
#
# src/peppermint/tests/privacy_defaults/ fails when a Firefox merge adds an AI
# switch that defaults to on, so add it here.

# Chatbot entry points on the page and in the context menu.
- name: browser.ml.chat.page
  value: false

- name: browser.ml.chat.page.footerBadge
  value: false

- name: browser.ml.chat.page.menuBadge
  value: false

- name: browser.ml.chat.shortcuts.smartwindow
  value: false

# "Smart Window" (an AI assistant window) is off in Firefox; its parts stay
# off on their own too, and it never learns "memories" from history.
- name: browser.smartwindow.agent.enabled
  value: false

- name: browser.smartwindow.agent.toolbar.enabled
  value: false

- name: browser.smartwindow.autoTabGrouping.enabled
  value: false

# Would download the grouping models ahead of use.
- name: browser.smartwindow.autoTabGrouping.preloadModels
  value: false

- name: browser.smartwindow.location.enabled
  value: false

- name: browser.smartwindow.memories.generateFromConversation
  value: false

- name: browser.smartwindow.memories.generateFromHistory
  value: false

- name: browser.smartwindow.resumeActivity.enabled
  value: false

- name: browser.smartwindow.resumeCards.enabled
  value: false

- name: browser.smartwindow.smartformfill.enabled
  value: false

# AI tab group names and suggestions.
- name: browser.tabs.groups.smart.enabled
  value: false

- name: browser.tabs.groups.smart.userEnabled
  value: false

- name: browser.tabs.groups.smart.searchTopicEnabled
  value: false

# History search by meaning (local embeddings of every visited page).
- name: places.semanticHistory.featureGate
  value: false

# The trial ML API that lets extensions run models.
- name: extensions.ml.enabled
  value: false

# "Search image with Google Lens".
- name: browser.search.visualSearch.featureGate
  value: false
