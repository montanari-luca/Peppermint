name: Bug Report
description: File a bug report
body:
  - type: markdown
    attributes:
      value: |
        <p align="center">
          <img src="https://raw.githubusercontent.com/montanari-luca/Peppermint/mine/branding-art/peppermint-full.png" alt="Peppermint" width="96">
        </p>

        <p align="center"><em>Thank you for filing a bug report!</em></p>

        > [!IMPORTANT]
        > - Please provide descriptive titles. Bad titles do more harm than good.
        > - Please search existing issues to avoid creating duplicates.
        > - For new features, use the Feature request template instead.
        > - Please fill out the template below to the best of your ability.
        > - Please describe the issue as much as possible and provide steps to reproduce it along with visual aids if possible.
  - type: checkboxes
    id: captchas
    attributes:
      label: Preliminary Checks
      description: Please confirm the following before submitting a bug report. This helps us triage and resolve issues more efficiently.
      options:
        - label: I have read and understood the important section above.
          required: true
        - label: I have searched existing issues and avoided creating duplicates.
          required: true
        - label: I am not filing an enhancement request.
          required: true
        - label: I have checked whether this issue also happens in Mozilla Firefox (say so below if it does).
          required: true
        - label: I have checked that this issue can be reproduced once I removed all my Mods and Custom CSS.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug clearly and concisely.
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: input
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Please write a description of what was supposed to happen.
    validations:
      required: true
  - type: input
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: Please write a description of what actually happened.
    validations:
      required: true
  - type: textarea
    id: how-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Please Provide numbered steps to reproduce this issue so developers can replicate them easily.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots and videos
      description: |
        If applicable, add screenshots or videos to help explain your problem.
  - type: input
    id: version
    attributes:
      label: Version
      description: Which Peppermint version are you running? Please do not write "latest". Go to `Help -> About Peppermint` to find the version number.
      placeholder: 2026.0.4
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: What platform are you seeing the problem on?
      multiple: true
      options:
        - Linux (Tarball)
        - macOS - Apple silicon
        - macOS - Intel
        - Windows - aarch64
        - Windows - x64
        - Other
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: What component is this issue related to?
      options:
        - Other
        - Bookmarks
        - Compact Mode
        - Customizable UI / Toolbars
        - Extensions
        - Glance
        - Keyboard Shortcuts
        - Localization
        - Media Controler
        - Mods / Themes
        - Performance
        - Privacy
        - Security
        - Settings
        - Split View
        - Sync
        - Tab Folders
        - Tab unloading
        - Tabs
        - URL Bar
        - Workspaces
        - Peppermint feature (notes, vault, reader, tab archive, ...)
        - Updates
    validations:
      required: true

  - type: textarea
    id: startup-report
    attributes:
      label: about:report and about:support
      description: If the problem is about speed or startup, paste the Startup doctor section of `about:report`. For other problems, `about:support` (Copy text to clipboard) helps.
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output if applicable
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell
