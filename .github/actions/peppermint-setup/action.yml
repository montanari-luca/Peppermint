# Prepares an Ubuntu runner for a Peppermint build: system packages, Node,
# the Firefox source, Rust, the imported patches and Firefox's bootstrap.
# Used by peppermint-tests.yml, peppermint-linux-build.yml and the cross
# builds in peppermint-macos-build.yml. The job checks the repository out
# first, and sets SURFER_FORCE_CANDIDATE=1 (src/ targets the candidate in
# surfer.json, as local builds do).
name: Peppermint build setup
description: Install everything a Peppermint build needs on Ubuntu

inputs:
  platform:
    description: Target platform, linux or darwin
    required: true
  arch:
    description: Target architecture, x86_64 or aarch64
    required: true
  brand:
    description: Surfer brand
    required: false
    default: release
  sccache:
    description: Use sccache with the Actions cache
    required: false
    default: "true"
  language-packs:
    description: Fetch the language packs that release builds ship
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Free disk space
      # v1.3.1
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
      with:
        tool-cache: false

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Enable sccache
      if: inputs.sccache == 'true'
      # v0.0.9
      uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad
      with:
        disable_annotations: true

    - name: Expose Actions cache variables for sccache
      if: inputs.sccache == 'true'
      uses: actions/github-script@v7
      with:
        script: |
          core.exportVariable("ACTIONS_CACHE_URL", process.env.ACTIONS_CACHE_URL);
          core.exportVariable("ACTIONS_RUNTIME_TOKEN", process.env.ACTIONS_RUNTIME_TOKEN);
          core.exportVariable("SCCACHE_GHA_ENABLED", "true");

    - name: Setup Git
      shell: bash
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: Install system packages
      shell: bash
      run: |
        sudo apt-get -o Acquire::Retries=3 update
        sudo apt-get -o Acquire::Retries=3 install -y \
          python3 python3-pip dos2unix zstd yasm nasm build-essential \
          libgtk2.0-dev libpython3-dev m4 uuid libasound2-dev \
          libcurl4-openssl-dev libdbus-1-dev libdrm-dev libdbus-glib-1-dev \
          libgtk-3-dev libpulse-dev libx11-xcb-dev libxt-dev xvfb lld llvm \
          --fix-missing

    - name: Install Node dependencies
      shell: bash
      run: npm ci

    - name: Load Surfer CI setup
      shell: bash
      env:
        BRAND: ${{ inputs.brand }}
      run: npm run surfer -- ci --brand "$BRAND"

    - name: Download Firefox
      shell: bash
      run: npm run download

    - name: Cache macOS cross tools
      if: inputs.platform == 'darwin'
      id: mac-cross
      uses: actions/cache@v4
      with:
        path: ~/mac-cross
        key: mac-cross-${{ hashFiles('surfer.json') }}

    - name: Fetch macOS cross tools (cctools and disk image tools)
      if: inputs.platform == 'darwin' && steps.mac-cross.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -ex
        mkdir -p ~/mac-cross
        cd engine
        ./mach artifact toolchain --from-build linux64-cctools-port linux64-libdmg linux64-hfsplus
        mv cctools dmg hfsplus ~/mac-cross/
        ls ~/mac-cross/cctools/bin/x86_64-apple-darwin-ld ~/mac-cross/dmg/dmg ~/mac-cross/hfsplus/newfs_hfs

    - name: Setup Rust
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        ARCH: ${{ inputs.arch }}
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y \
          --default-toolchain "$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
        # shellcheck disable=SC1091
        . "$HOME/.cargo/env"
        case "$PLATFORM" in
          darwin) rustup target add "$ARCH-apple-darwin" ;;
          *) rustup target add "$ARCH-unknown-linux-gnu" ;;
        esac

    - name: Import patches
      shell: bash
      env:
        SURFER_COMPAT: ${{ inputs.arch }}
        SURFER_PLATFORM: ${{ inputs.platform }}
      run: |
        # shellcheck disable=SC1091
        . "$HOME/.cargo/env"
        npm run import -- --verbose

    - name: Bootstrap
      shell: bash
      env:
        SURFER_PLATFORM: ${{ inputs.platform }}
      run: |
        if test "$SURFER_PLATFORM" = darwin; then
          npm run bootstrap
        else
          cd engine
          ./mach --no-interactive bootstrap --application-choice browser
        fi

    - name: Fetch language packs
      if: inputs.language-packs == 'true'
      shell: bash
      run: sh scripts/download-language-packs.sh
