# Applies semver-safe npm audit fixes every Monday (npm run audit:fix-safe)
# and opens a pull request into mine when package.json or package-lock.json
# change.
#
# Needs the SYNC_TOKEN secret (see peppermint/RELEASING.md): pull requests
# opened with the built-in token start no checks. Without the secret the run
# stays green, explains what is missing and lists the pending fixes in its
# summary.
name: Weekly npm audit

on:
  schedule:
    # Mondays 09:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

# SYNC_TOKEN pushes the branch and opens the pull request; the built-in
# token only checks the repository out.
permissions:
  contents: read

concurrency:
  group: npm-audit-weekly
  cancel-in-progress: false

jobs:
  audit-and-fix:
    name: Safe npm audit fixes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_TOKEN: ${{ secrets.SYNC_TOKEN != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      - name: Apply safe audit fixes
        run: npm run audit:fix-safe

      - name: Check if dependency files changed
        id: git-check
        run: |
          if git status --porcelain -- package.json package-lock.json | grep -q .; then
            echo "files_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "files_changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Written outside the checkout so it never ends up in the commit.
      - name: Prepare pull request body
        if: steps.git-check.outputs.files_changed == 'true'
        run: |
          cat <<'EOF' > "$RUNNER_TEMP/npm-audit-pr-body.md"
          Automated weekly dependency security maintenance.

          **What this PR does**
          - Runs `npm run audit:fix-safe` (`npm audit fix` without `--force`)
          - Bumps the `sharp` override when audit still flags sharp, with a surfer branding smoke test
          - Does **not** run `npm audit fix --force` (e.g. lint-staged major upgrades)

          **Remaining high+ findings** (if any; may be accepted dev-only risk):
          EOF
          {
            echo '```'
            npm audit --audit-level=high 2>&1 || true
            echo '```'
            echo ""
            echo "Workflow run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> "$RUNNER_TEMP/npm-audit-pr-body.md"

      - name: Create pull request
        if: steps.git-check.outputs.files_changed == 'true' && env.HAS_TOKEN == 'true'
        # v8.1.3
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1
        with:
          token: ${{ secrets.SYNC_TOKEN }}
          add-paths: |
            package.json
            package-lock.json
          commit-message: "chore: apply safe npm audit fixes"
          branch: "chore/npm-audit-${{ github.run_id }}"
          title: "chore: weekly safe npm audit fixes"
          body-path: ${{ runner.temp }}/npm-audit-pr-body.md
          base: mine
          delete-branch: true

      - name: Explain a missing token
        if: env.HAS_TOKEN != 'true'
        env:
          FILES_CHANGED: ${{ steps.git-check.outputs.files_changed }}
        run: |
          if [[ "$FILES_CHANGED" == "true" ]]; then
            echo "::notice::Safe npm audit fixes are ready but no pull request was opened: set the SYNC_TOKEN secret (see peppermint/RELEASING.md). The fixes are in this run's summary."
            {
              echo "### Pending npm audit fixes"
              echo ""
              echo "No pull request was opened because the SYNC_TOKEN secret is not set (see peppermint/RELEASING.md)."
              echo ""
              echo '```'
              git diff --stat -- package.json package-lock.json
              echo '```'
              echo ""
              cat "$RUNNER_TEMP/npm-audit-pr-body.md"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice::No safe npm audit fixes this week. Set the SYNC_TOKEN secret (see peppermint/RELEASING.md) so future fixes open a pull request."
          fi
